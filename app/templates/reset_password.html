<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Royal Tashkent</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='/css/responsive.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='/css/auth.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
</head>
<body data-auth-page="reset-password">
    <div class="auth-container">
        <div class="auth-overlay"></div>
        <div class="auth-box">
            <h2 data-i18n="reset_title">Reset Password</h2>
            <p class="verify-copy" data-i18n="reset_copy">Enter code from email and set a new password.</p>
            <div id="auth-message"></div>

            <form action="/reset-password" method="POST" autocomplete="off">
                <input type="hidden" name="email" value="{{ email }}">
                <input type="hidden" name="code" id="reset-code-hidden">
                <div class="auth-input-group">
                    <label data-i18n="verify_code_label">Verification Code</label>
                    <div class="code-inputs" data-code-inputs>
                        <input type="text" name="code_1" maxlength="1" inputmode="numeric" pattern="[0-9]" data-code-cell required>
                        <input type="text" name="code_2" maxlength="1" inputmode="numeric" pattern="[0-9]" data-code-cell required>
                        <input type="text" name="code_3" maxlength="1" inputmode="numeric" pattern="[0-9]" data-code-cell required>
                        <input type="text" name="code_4" maxlength="1" inputmode="numeric" pattern="[0-9]" data-code-cell required>
                        <input type="text" name="code_5" maxlength="1" inputmode="numeric" pattern="[0-9]" data-code-cell required>
                        <input type="text" name="code_6" maxlength="1" inputmode="numeric" pattern="[0-9]" data-code-cell required>
                    </div>
                </div>
                <div class="auth-input-group">
                    <label data-i18n="reset_new_password">New Password</label>
                    <input type="password" name="new_password" minlength="6" required>
                </div>
                <div class="auth-input-group">
                    <label data-i18n="reset_confirm_password">Confirm Password</label>
                    <input type="password" name="confirm_password" minlength="6" required>
                </div>
                <button type="submit" class="auth-btn" data-code-submit data-i18n="reset_submit">Reset Password</button>
            </form>

            <form action="/forgot-password" method="POST" class="resend-form" data-resend-form data-resend-seconds="60" data-resend-key="reset:{{ email }}">
                <input type="hidden" name="email" value="{{ email }}">
                <button type="submit" class="auth-btn resend-btn" data-resend-button data-i18n="verify_resend">Resend Code</button>
            </form>

            <div class="auth-back">
                <a href="/login" data-i18n="login_back">Back to Home</a>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', path='/js/i18n.js') }}"></script>
    <script src="{{ url_for('static', path='/js/auth.js') }}"></script>
</body>
</html>
