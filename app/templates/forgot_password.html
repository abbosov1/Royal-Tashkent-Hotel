<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Royal Tashkent</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='/css/responsive.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='/css/auth.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
</head>
<body data-auth-page="forgot-password">
    <div class="auth-container">
        <div class="auth-overlay"></div>
        <div class="auth-box">
            <h2 data-i18n="forgot_title">Forgot Password</h2>
            <p class="verify-copy" data-i18n="forgot_copy">Enter your email, we will send a 6-digit reset code.</p>
            <div id="auth-message"></div>

            <form action="/forgot-password" method="POST" autocomplete="off">
                <div class="auth-input-group">
                    <label>Email</label>
                    <input type="email" name="email" required>
                </div>
                <button type="submit" class="auth-btn" data-i18n="forgot_submit">Send Reset Code</button>
            </form>

            <div class="auth-back">
                <a href="/login" data-i18n="login_back">Back to Home</a>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', path='/js/i18n.js') }}"></script>
    <script src="{{ url_for('static', path='/js/auth.js') }}"></script>
</body>
</html>
