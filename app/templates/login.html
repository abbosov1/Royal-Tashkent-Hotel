<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Register | Royal Tashkent</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
    <style>
        .auth-container { display: flex; min-height: 100vh; align-items: center; justify-content: center; background: url('/static/images/hero.jpg') center/cover; position: relative; }
        .auth-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); }
        .auth-box { position: relative; z-index: 10; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); backdrop-filter: blur(15px); padding: 4rem; border-radius: 20px; width: 100%; max-width: 500px; color: var(--light); box-shadow: 0 25px 50px rgba(0,0,0,0.3); }
        .auth-box h2 { font-family: 'Syncopate', sans-serif; font-size: 2rem; margin-bottom: 2rem; text-align: center; }
        .auth-tabs { display: flex; justify-content: center; margin-bottom: 2rem; gap: 2rem; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 1rem; }
        .auth-tabs span { cursor: pointer; font-family: 'Syncopate', sans-serif; text-transform: uppercase; font-size: 0.9rem; color: rgba(255,255,255,0.5); transition: color 0.3s ease; }
        .auth-tabs span.active { color: var(--primary); font-weight: bold; }
        .form-section { display: none; }
        .form-section.active { display: block; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .auth-input-group { margin-bottom: 1.5rem; }
        .auth-input-group label { display: block; font-family: 'Syncopate', sans-serif; font-size: 0.7rem; letter-spacing: 1px; margin-bottom: 0.5rem; text-transform: uppercase;}
        .auth-input-group input { width: 100%; padding: 1rem 0; background: transparent !important; border: none; border-bottom: 2px solid rgba(255,255,255,0.2); color: var(--light); border-radius: 0; font-family: 'Playfair Display', serif; font-size: 1rem; outline: none; transition: border 0.3s; }
        .auth-input-group input:focus { border-bottom-color: var(--primary); }
        .auth-btn { width: 100%; padding: 1rem; background: var(--primary); color: #000; border: none; font-family: 'Syncopate', sans-serif; font-size: 1rem; text-transform: uppercase; border-radius: 30px; cursor: pointer; transition: transform 0.3s, box-shadow 0.3s; margin-top: 1rem; }
        .auth-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(203, 168, 124, 0.4); }
        .alert { padding: 1rem; border-radius: 10px; margin-bottom: 1.5rem; font-family: sans-serif; font-size: 0.9rem; text-align: center;}
        .alert.error { background: rgba(255, 50, 50, 0.2); border: 1px solid rgba(255, 50, 50, 0.5); }
        .alert.success { background: rgba(50, 255, 50, 0.2); border: 1px solid rgba(50, 255, 50, 0.5); }
    
        body.light-mode .auth-input-group input { 
            background: transparent !important; 
            border-bottom: 2px solid #D4C4B0 !important; 
            color: #1C1008 !important; 
        }
        body.light-mode .auth-input-group input:focus {
            border-bottom-color: var(--primary) !important;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-overlay"></div>
        <div class="auth-box">
            <h2>Welcome</h2>
            
            <script>
                const urlParams = new URLSearchParams(window.location.search);
                if(urlParams.get('error') == '1') document.write('<div class="alert error">Invalid credentials</div>');
                if(urlParams.get('error') == '2') document.write('<div class="alert error">Email already registered</div>');
                if(urlParams.get('registered') == '1') document.write('<div class="alert success">Successfully registered! Please login.</div>');
            </script>

            <div class="auth-tabs">
                <span class="active" onclick="switchTab('login')">Login</span>
                <span onclick="switchTab('register')">Register</span>
            </div>

            <div id="login-form" class="form-section active">
                <form action="/login" method="POST">
                    <div class="auth-input-group">
                        <label>Email</label>
                        <input type="email" name="email" required>
                    </div>
                    <div class="auth-input-group">
                        <label>Password</label>
                        <div style="position:relative;">
                            <input type="password" name="password" required style="padding-right:40px;">
                            <span onclick="togglePwd(this)" style="position:absolute; right:10px; top:50%; transform:translateY(-50%); cursor:pointer; color:#666; font-size:1.2rem;">👁️</span>
                        </div>
                    </div>
                    <button type="submit" class="auth-btn">Sign In</button>
                </form>
            </div>

            <div id="register-form" class="form-section">
                <form action="/register" method="POST">
                    <div class="auth-input-group">
                        <label>Full Name</label>
                        <input type="text" name="full_name" required>
                    </div>
                    <div class="auth-input-group">
                        <label>Email</label>
                        <input type="email" name="email" required>
                    </div>
                    <div class="auth-input-group">
                        <label>Password</label>
                        <div style="position:relative;">
                            <input type="password" name="password" required style="padding-right:40px;">
                            <span onclick="togglePwd(this)" style="position:absolute; right:10px; top:50%; transform:translateY(-50%); cursor:pointer; color:#666; font-size:1.2rem;">👁️</span>
                        </div>
                    </div>
                    <button type="submit" class="auth-btn">Create Account</button>
                </form>
            </div>
            
            <div style="text-align: center; margin-top: 2rem;">
                <a href="/" style="color: var(--light); font-family: 'Playfair Display', serif; text-decoration: none; border-bottom: 1px solid var(--primary);">← Back to Home</a>
            </div>
        </div>
    </div>

    <script>
        function switchTab(tab) {
            document.querySelectorAll('.auth-tabs span').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.form-section').forEach(el => el.classList.remove('active'));
            
            if(tab === 'login') {
                document.querySelectorAll('.auth-tabs span')[0].classList.add('active');
                document.getElementById('login-form').classList.add('active');
            } else {
                document.querySelectorAll('.auth-tabs span')[1].classList.add('active');
                document.getElementById('register-form').classList.add('active');
            }
        }
    </script>




    <script>
        function setTheme(theme) {
            document.body.classList.toggle('light-mode', theme === 'light');
            localStorage.setItem('theme', theme);
            const icon = document.getElementById('theme-icon');
            if(icon) {
                icon.innerText = theme === 'light' ? '🌙' : '☀️';
            }
        }

        function toggleTheme() {
            const currentTheme = localStorage.getItem('theme') || 'dark';
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            setTheme(newTheme);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            setTheme(savedTheme);
        });
    </script>
    
<script>
    function togglePwd(el) {
        var x = el.previousElementSibling;
        if (x.type === "password") {
            x.type = "text";
            el.innerText = "🙈";
        } else {
            x.type = "password";
            el.innerText = "👁️";
        }
    }
    </script>
    </body>


</html>
