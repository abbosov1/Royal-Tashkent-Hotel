<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Royal Tashkent</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='/css/responsive.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='/css/auth.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
</head>
<body data-auth-page="login">
    <div class="auth-container">
        <div class="auth-overlay"></div>
        <div class="auth-box">
            <div class="auth-lang">
                <select data-lang-select aria-label="Language switcher">
                    <option value="en">EN</option>
                    <option value="ru">RU</option>
                    <option value="uz">UZ</option>
                </select>
            </div>

            <h2 data-i18n="login_title">Welcome Back</h2>

            <div id="auth-message"></div>

            <div class="auth-switch"><span data-i18n="login_no_account">No account?</span> <a href="/register" data-i18n="login_switch">Register</a></div>

            <form action="/login" method="POST" autocomplete="on">
                <div class="auth-input-group">
                    <label>Email</label>
                    <input type="email" name="email" autocomplete="email" required>
                </div>
                <div class="auth-input-group">
                    <label>Password</label>
                    <div class="password-field">
                        <input type="password" name="password" autocomplete="current-password" required>
                        <button type="button" class="password-toggle" onclick="togglePwd(this)" aria-label="Toggle password visibility">
                            <span class="material-symbols-outlined">visibility_off</span>
                        </button>
                    </div>
                </div>
                <button type="submit" class="auth-btn" data-i18n="login_signin">Sign In</button>
            </form>

            <div class="auth-back">
                <a href="/" data-i18n="login_back">Back to Home</a>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', path='/js/i18n.js') }}"></script>
    <script src="{{ url_for('static', path='/js/auth.js') }}"></script>
</body>
</html>
