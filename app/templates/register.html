<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Royal Tashkent</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='/css/responsive.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='/css/auth.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
</head>
<body data-auth-page="register">
    <div class="auth-container">
        <div class="auth-overlay"></div>
        <div class="auth-box">
            <div class="auth-lang">
                <div class="lang-pill" role="group" aria-label="Language switcher">
                    <button type="button" data-lang-btn="en">EN</button>
                    <button type="button" data-lang-btn="ru">RU</button>
                    <button type="button" data-lang-btn="uz">UZ</button>
                </div>
            </div>

            <h2 data-i18n="register_title">Create Account</h2>

            <div id="auth-message"></div>

            <div class="auth-switch"><span data-i18n="register_have_account">Already have an account?</span> <a href="/login" data-i18n="register_switch">Login</a></div>

            <form action="/register" method="POST" autocomplete="on">
                <div class="auth-input-group">
                    <label>Full Name</label>
                    <input type="text" name="full_name" autocomplete="name" required>
                </div>
                <div class="auth-input-group">
                    <label>Email</label>
                    <input type="email" name="email" autocomplete="email" required>
                </div>
                <div class="auth-input-group">
                    <label>Password</label>
                    <div class="password-field">
                        <input type="password" name="password" autocomplete="new-password" required>
                        <button type="button" class="password-toggle" data-password-toggle aria-label="Toggle password visibility">
                            <span class="material-symbols-outlined">visibility_off</span>
                        </button>
                    </div>
                </div>
                <button type="submit" class="auth-btn" data-i18n="register_submit">Create Account</button>
            </form>

            <div class="auth-back">
                <a href="/" data-i18n="login_back">Back to Home</a>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', path='/js/i18n.js') }}"></script>
    <script src="{{ url_for('static', path='/js/auth.js') }}"></script>
</body>
</html>
